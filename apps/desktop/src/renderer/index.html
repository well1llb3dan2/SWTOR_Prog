<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>SWTOR Combat Streamer</title>
    <style>
      :root {
        --bg: #0b1410;
        --panel: #111d18;
        --line: #1e332a;
        --green: #4ade80;
        --gold: #d4af37;
        --text: #d8e6df;
        --muted: #7d968b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 16px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 7px 9px;
        background: #0a120e;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        padding: 7px 14px;
        background: transparent;
        border: 1px solid var(--green);
        border-radius: 4px;
        color: var(--green);
        font-family: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: rgba(74, 222, 128, 0.12);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        border-color: var(--gold);
        color: var(--gold);
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      dl {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 0;
      }
      dt {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      dd {
        margin: 0;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.connected {
        background: var(--green);
      }
      .dot.error {
        background: #f87171;
      }
      .dot.reconnecting,
      .dot.connecting {
        background: var(--gold);
      }
      .detail {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
        min-height: 16px;
      }
      progress {
        width: 100%;
        height: 6px;
      }
    </style>
  </head>
  <body>
    <h1>SWTOR Combat Streamer</h1>

    <section>
      <h2>Connection</h2>
      <div class="row">
        <div>
          <label for="discordLogin">Discord account</label>
          <div id="authState" class="detail">Discord not linked.</div>
        </div>
        <div style="align-self: end"><button id="discordLogin">Sign out</button></div>
      </div>
      <div class="row">
        <div>
          <label for="logDirectory">Combat log folder</label>
          <input id="logDirectory" type="text" readonly />
        </div>
        <div style="align-self: end"><button id="pickDir">Browse</button></div>
      </div>
      <div class="state">
        <span id="dot" class="dot"></span>
        <span id="connection">idle</span>
      </div>
      <div id="detail" class="detail"></div>
    </section>

    <section>
      <h2>Streaming</h2>
      <div class="actions">
        <button id="startLive" class="primary">Start live</button>
        <button id="pickReplay">Replay a log…</button>
        <select id="speed" style="width: auto">
          <option value="1">1x</option>
          <option value="4" selected>4x</option>
          <option value="10">10x</option>
          <option value="60">60x</option>
        </select>
        <button id="stop">Stop</button>
      </div>
      <div id="replayWrap" style="display: none; margin-top: 12px">
        <progress id="replay" max="100" value="0"></progress>
      </div>
      <div id="report" class="detail"></div>
    </section>

    <section>
      <h2>Activity</h2>
      <dl>
        <div><dt>File</dt><dd id="fileName" style="font-size: 12px">—</dd></div>
        <div><dt>Zone</dt><dd id="zone" style="font-size: 12px">—</dd></div>
        <div><dt>Events/sec</dt><dd id="rate">0</dd></div>
        <div><dt>Events parsed</dt><dd id="parsed">0</dd></div>
        <div><dt>Queued</dt><dd id="queued">0</dd></div>
        <div><dt>Unparsed lines</dt><dd id="unknown">0</dd></div>
      </dl>
    </section>

    <script src="app.js"></script>
  </body>
</html>
