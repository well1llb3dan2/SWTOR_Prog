appId: gg.infamous.swtor.streamer
productName: SWTOR Combat Streamer
copyright: Infamous

directories:
  output: release
  buildResources: build

# Only the bundled output ships; src and node_modules are already inlined by
# esbuild, so the installer stays small.
files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico

nsis:
  artifactName: SWTOR-Combat-Streamer-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

portable:
  artifactName: SWTOR-Combat-Streamer-${version}-portable.${ext}

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

publish:
  provider: github
  owner: well1llb3dan2
  repo: SWTOR_Prog
  releaseType: release
