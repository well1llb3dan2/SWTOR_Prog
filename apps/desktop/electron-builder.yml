appId: gg.infamous.swtor.streamer
productName: SWTOR Combat Streamer
copyright: Infamous

directories:
  output: release
  buildResources: build

# Only the bundled output ships; src and node_modules are already inlined by
# esbuild, so the installer stays small.
files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]
  sign: false
  signAndEditExecutable: false
  icon: build/icon.ico

# Avoid code-signing infrastructure issues on local builds.
# Set CSC_LINK / CSC_KEY_PASSWORD later if you want a signed installer.
artifactName: SWTOR-Combat-Streamer-${version}-setup.${ext}

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

publish:
  provider: github
  releaseType: release
