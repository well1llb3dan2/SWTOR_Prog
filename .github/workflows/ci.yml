name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm exec eslint .

      - name: Format check
        run: pnpm exec prettier --check "packages/**/*.ts" "apps/**/*.{ts,tsx}"

      # Kept separate from the builds: a concurrent build starves the event
      # loop and makes the realtime socket tests flaky.
      - name: Test
        run: pnpm vitest run

      - name: Build API
        run: pnpm --filter @swtor/api build

      - name: Build bot
        run: pnpm --filter @swtor/bot build

      - name: Build web
        run: pnpm --filter @swtor/web build

      - name: Build desktop bundles
        run: pnpm --filter @swtor/desktop build
